[project]
name = "autoseguro-agent"
version = "0.1.0"
description = "Agente de vendas de seguro auto (desafio FDE Namastex) — cota numa API instável sem inventar preço e escala para humano com critério explícito"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
]

[tool.uv]
package = false
