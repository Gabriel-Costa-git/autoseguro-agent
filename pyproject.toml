[project]
name = "autoseguro-agent"
version = "0.1.0"
description = "Agente de vendas de seguro auto (desafio FDE Namastex) — cota numa API instável sem inventar preço e escala para humano com critério explícito"
requires-python = ">=3.12"
dependencies = [
    "agno>=3.0",
    "fastapi>=0.110",
    "google-genai>=2.21.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pandas>=2.2",
    "pyarrow>=17",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.5",
]

[tool.uv]
package = false
